/* Refined product styling: clearer hierarchy, calmer surfaces, and consistent focus states. */
:root{--ink:#302744;--muted:#827992;--purple:#7653ba;--line:#e9e3f0;--shadow:0 8px 28px #3824530b}
body{background:radial-gradient(ellipse at 14% 0%,#f1e9ff 0,transparent 34%),var(--bg);letter-spacing:.005em}
button,input,select{transition:background-color .18s,border-color .18s,box-shadow .18s,transform .18s}
:focus-visible{outline:3px solid #bd9ded;outline-offset:3px}
.sidebar{background:#fff;border-color:#e9e3f0}
.brand strong,.page-title,.section-head h2,.panel h3,.quizcard h3{letter-spacing:-.02em}
.hero{background:linear-gradient(115deg,#6847a8 0%,#8662c1 52%,#b58bd9 100%);box-shadow:0 16px 38px #6b4ba52a}
.stat,.panel,.quizcard{border-color:#ece6f2;box-shadow:var(--shadow)}
.stat{background:linear-gradient(155deg,#fff,#fdfbff)}
.stat-top{text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:700}
.quizcard{border-radius:19px;padding:18px;min-height:178px}
.quizcard h3{font-size:17px;line-height:1.25}
.quizcard p{line-height:1.55;min-height:32px}
.quizcard .tag{background:#f2ecf9;color:#7253a8;font-weight:700}
.quizcard:hover{border-color:#d7c5ee;box-shadow:0 14px 30px #52377716}
.toolbar .field{box-shadow:0 2px 5px #30274407}
.filter{border-color:#e9e3f0}
.primary{box-shadow:0 5px 13px #7653ba2b}
@media(min-width:1300px){.cards{grid-template-columns:repeat(4,1fr)}}

/* Playful kingdom flourishes */
.hero{isolation:isolate;background-image:radial-gradient(circle at 77% 27%,#fff7d526 0 3px,transparent 4px),radial-gradient(circle at 86% 48%,#fff7d526 0 2px,transparent 3px),radial-gradient(circle at 68% 72%,#fff7d526 0 2px,transparent 3px),linear-gradient(115deg,#6847a8 0%,#8662c1 52%,#b58bd9 100%);background-size:auto,auto,auto,auto}
.hero:after{z-index:-1;animation:castleBob 4s ease-in-out infinite;filter:drop-shadow(0 10px 12px #40276a35)}
.hero:before{animation:starTwinkle 2.8s ease-in-out infinite alternate}
.hero-sprite{position:absolute;right:29%;bottom:24px;font-size:43px;z-index:0;filter:drop-shadow(0 6px 5px #49315a35);animation:owlFloat 3.2s ease-in-out infinite;transform-origin:50% 70%}
.hero:after,.hero:before{pointer-events:none}
.hero h1,.hero p,.hero .eyebrow,.hero button{position:relative;z-index:1}
.crest{position:relative;animation:crestGlow 3s ease-in-out infinite}
.crest:after{content:'✦';position:absolute;right:-5px;top:-5px;font-size:12px;color:#ffe99e;animation:starTwinkle 1.8s ease-in-out infinite alternate}
.cat,.quizcard,.stat,.daily{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.cat:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:0 13px 24px #7653ba1d;border-color:#d6c4ee}
.quizcard:hover{transform:translateY(-5px) rotate(-.35deg)}
.quizcard .bigicon,.cat-icon{display:inline-block;transition:transform .22s}
.quizcard:hover .bigicon,.cat:hover .cat-icon{transform:scale(1.18) rotate(-7deg)}
.stat:hover{transform:translateY(-3px);box-shadow:0 13px 30px #7653ba17}
.btn-gold{position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 20px #50371b38}
.btn-gold:after{content:'';position:absolute;inset:0;transform:translateX(-130%);background:linear-gradient(110deg,transparent,#fff8,transparent);transition:transform .65s}
.btn-gold:hover:after{transform:translateX(130%)}
.question-card{animation:cardArrive .38s cubic-bezier(.2,.8,.2,1)}
.answer{transition:transform .16s,border-color .16s,background .16s}
.answer:not(:disabled):hover{transform:translateX(4px)}
.answer.correct .letter{background:#d9f1e4;color:#39795b}
.answer.wrong .letter{background:#ffe0e6;color:#ac526b}
.results .cup{display:inline-block;animation:cupBounce 1.7s ease-in-out infinite}
.results{position:relative;overflow:hidden}
.results:before,.results:after{position:absolute;top:34px;font-size:23px;color:#eac45f;animation:starTwinkle 1.6s ease-in-out infinite alternate;pointer-events:none}
.results:before{content:'✦';left:12%}.results:after{content:'✧';right:12%;animation-delay:.7s}
@keyframes castleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes owlFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes starTwinkle{from{opacity:.45;filter:brightness(.95)}to{opacity:1;filter:brightness(1.25)}}
@keyframes crestGlow{0%,100%{box-shadow:0 6px 15px #7955c744}50%{box-shadow:0 7px 21px #b18ae777}}
@keyframes cupBounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes cardArrive{from{opacity:.65;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
body.calm *,body.calm *:before,body.calm *:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
@media(max-width:620px){.hero-sprite{right:28%;bottom:18px;font-size:34px}.hero:after{right:2%;font-size:84px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

span></div><strong>${state.streak} days</strong><small>Personal best: ${state.best} days</small></div><div class="stat"><div class="stat-top">Kingdom crowns <span class="stat-icon">♛</span></div><strong>${state.crowns}</strong><small>${state.unlocked.length} decoration${state.unlocked.length===1?'':'s'} collected</small></div></div><div class="split"><div class="panel"><h3>Choose your realm</h3><p class="sub">Pick a topic that sparks your curiosity.</p><div class="category-grid">${Object.entries(categories).map(([c,[i,n]])=>`<button class="cat" onclick="start('${c}')"><span class="cat-icon">${i}</span><strong>${c}</strong><small>${n} quizzes to explore</small><div class="progressbar"><i style="width:${Math.min(100,(state.history.filter(h=>h.icon===i).length+1)*17)}%"></i></div></button>`).join('')}</div><div style="text-align:right;margin-top:10px"><button class="linkbtn" onclick="go('Quizzes')">Browse all quizzes →</button></div></div><div style="display:grid;gap:15px"><div class="panel daily"><span class="daily-icon">☀️</span><span class="eyebrow" style="color:#bf8d3d">TODAY'S SPECIAL</span><h3>Daily Royal Quest</h3><p>A fresh collection of five questions awaits. Complete it to earn bonus crowns and keep your streak alive.</p><div class="daily-meta"><span>◷ 3 min</span><span>♛ +25 bonus</span><span>✦ ${state.streak} day streak</span></div><button class="btn-gold" onclick="daily()">Begin daily quest →</button></div><div class="panel"><h3>Recently explored</h3><p class="sub">Your latest adventures</p><div class="recent">${state.history.slice(0,2).map(h=>`<div class="recent-row"><span class="cat-icon">${h.icon}</span><div><strong>${h.name}</strong><small>${new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'})} · ${h.score}/${h.total} correct</small></div><em>${Math.round(h.score/h.total*100)}%</em></div>`).join('')}</div></div></div></div>`}function arcade(){return `${head()}<h1 class="page-title">Game Arcade</h1><p class="page-sub">Choose a game style, then pick a realm to play.</p><div class="toolbar">${Object.keys(categories).map(c=>`<button class="filter ${arcadeCategory===c?'active':''}" onclick="arcadeCategory='${c}';render()">${categories[c][0]} ${c}</button>`).join('')}</div><div class="cards game-modes"><article class="quizcard game-mode" onclick="start(arcadeCategory,false,undefined,'classic')"><div class="game-mark">✦</div><span class="tag">5 questions</span><h3>Classic Quiz</h3><p>Multiple choice, friendly feedback, and a full answer review.</p><button class="primary">Play classic →</button></article><article class="quizcard game-mode" onclick="start(arcadeCategory,false,undefined,'truefalse')"><div class="game-mark">✓</div><span class="tag">5 questions</span><h3>True or False</h3><p>Decide whether each curious claim is fact or fiction.</p><button class="primary">Play true or false →</button></article><article class="quizcard game-mode" onclick="start(arcadeCategory,false,undefined,'lightning')"><div class="game-mark">ϟ</div><span class="tag">10 seconds each</span><h3>Lightning Round</h3><p>Answer before the clock runs out. Quick thinking earns the points.</p><button class="primary">Play lightning →</button></article><article class="quizcard game-mode" onclick="start(arcadeCategory,false,undefined,'scramble')"><div class="game-mark">Aa</div><span class="tag">Type your answer</span><h3>Word Scramble</h3><p>Unscramble the answer from a jumble of letters, one question at a time.</p><button class="primary">Play word scramble →</button></article></div>`}function quizzes(){let cats=Object.keys(categories),visible=catalog.filter(q=>(filter==='All'||filter===q.category)&&(!searchTerm||(q.name+' '+q.category).toLowerCase().includes(searchTerm.toLowerCase())));return `${head()}<h1 class="page-title">The Quiz Library</h1><p class="page-sub">120 themed adventures · six realms · fresh challenges for curious minds.</p><div class="toolbar"><input class="field" style="max-width:270px;margin:0" placeholder="Search 120 quizzes…" value="${searchTerm.replace(/"/g, "&quot;")}" oninput="searchTerm=this.value;const pos=this.selectionStart;render();const box=document.querySelector('.toolbar input');box.focus();box.setSelectionRange(pos,pos)">${['All',...cats].map(c=>`<button class="filter ${filter===c?'active':''}" onclick="filter='${c}';render()">${c==='All'?'✦ All realms':categories[c][0]+' '+c}</button>`).join('')} </div><p class="sub">Showing ${visible.length} of 120 curated quizzes</p><div class="cards">${visible.map(q=>`<article class="quizcard" onclick="start('${q.id}')"><div class="qtop"><span class="bigicon">${categories[q.category][0]}</span><span class="tag">${state.settings.difficulty} · ${state.settings.difficulty==='Easy'?'Gentle':state.settings.difficulty==='Medium'?'Balanced':'Challenge'}</span></div><h3>${q.name}</h3><p>${q.category} · a focused five-question adventure</p><div class="qbottom"><span>◷ 5 questions</span><span>♛ up to 5 crowns</span></div></article>`).join('')}${state.custom.map(q=>card(q.name,true)).join('')||''}${visible.length?'':'<div class="empty">No quizzes match that search. Try a broader term ✨</div>'}</div>`}function start(cat,isCustom=false,questions,mode='classic'){if(timerHandle){clearInterval(timerHandle);timerHandle=null}let item=catalog.find(x=>x.id===cat),qs=questions||(item?item.questions:(isCustom?state.custom.find(x=>x.name===cat).questions:bank[cat]));let level=state.settings.difficulty||'Easy';if(!questions&&!isCustom){let category=item?item.category:cat,tier=bank[category].filter(q=>q[5]==='Hard');if(level==='Hard'&&tier.length>=5)qs=tier;else if(level==='Easy')qs=bank[category].filter(q=>q[5]!=='Hard');else if(item)qs=bank[category]}let pool=[...new Map(qs.map(q=>[String(q[1]).trim().toLowerCase(),q])).values()],categoryOf=q=>item?item.category:(Object.entries(bank).find(([name,rows])=>rows.some(r=>r[1]===q[1]))?.[0]||cat),questionKey=q=>String(q[1]).trim().toLowerCase(),poolKey=q=>categoryOf(q)+'|'+level;let unseen=pool.filter(q=>!(state.questionHistory?.[poolKey(q)]||[]).includes(questionKey(q)));if(!unseen.length&&pool.length){for(const k of new Set(pool.map(poolKey)))state.questionHistory[k]=[]}let unseenPool=pool.filter(q=>!(state.questionHistory?.[poolKey(q)]||[]).includes(questionKey(q)));let shuffled=[...unseenPool].sort(()=>Math.random()-.5).slice(0,5);let usedQuestionRefs=shuffled.map(q=>({pool:poolKey(q),key:questionKey(q)}));shuffled=shuffled.map(raw=>{let q=[...raw],answers=[...q[2]];if(mode==='truefalse'){let tellTruth=Math.random()>.5,answerIndex=tellTruth?q[3]:answers.findIndex((_,i)=>i!==q[3]);q[1]=q[1]+' — '+answers[answerIndex];q[2]=['True','False'];q[3]=tellTruth?0:1}return q});let mult={Easy:.8,Medium:1,Hard:1.4}[level]||1;quiz={name:item?item.name:cat,category:item?item.category:cat,icon:item?categories[item.category][0]:(isCustom?'✨':categories[cat]?.[0]||'☀️'),questions:shuffled,usedQuestionRefs,idx:0,answers:[],pointsMult:mult,daily:cat==='Daily Royal Quest',mode,timeLeft:10};page='Play';if(mode==='lightning')startLightning();render()}function daily(){let level=state.settings.difficulty||'Easy',all=Object.values(bank).flat().filter(q=>level==='Hard'?q[5]==='Hard':level==='Easy'?q[5]!=='Hard':true).sort(()=>Math.random()-.5).slice(0,5);start('Daily Royal Quest',false,all);quiz.daily=true}function play(){if(!quiz)return home();let q=quiz.questions[quiz.idx],selected=quiz.answers[quiz.idx],locked=selected!==undefined,modeName={classic:'Classic Quiz',truefalse:'True or False',lightning:'Lightning Round',scramble:'Word Scramble'}[quiz.mode]||'Classic Quiz';let answerArea=quiz.mode==='scramble'?`<div class="scramble-hint">Unscramble this answer</div><div class="scramble-letters">${scrambleWord(q[2][q[3]])}</div><form class="scramble-form" onsubmit="submitScramble(event)"><input id="scrambleAnswer" class="field" autocomplete="off" placeholder="Type your answer…" ${locked?'disabled':''}><button class="primary" ${locked?'disabled':''}>Check answer</button></form>`:`<div class="answers">${q[2].map((a,i)=>`<button class="answer ${locked?(i===q[3]?'correct':(i===selected?'wrong':'')):(selected===i?'selected':'')}" ${locked?'disabled':''} onclick="choose(${i})"><span class="letter">${quiz.mode==='truefalse'?'•':'ABCD'[i]}</span>${a}</button>`).join('')}</div>`;
return `${head()}<div class="quiz-area"><div class="quiz-top"><button class="backbtn" onclick="confirmExit()">← Leave game</button><span class="tag">${quiz.icon} ${quiz.name} · ${modeName}</span></div><div class="quiz-progress"><i style="width:${(quiz.idx/quiz.questions.length)*100}%"></i></div><div class="question-meta"><span>Question ${quiz.idx+1} of ${quiz.questions.length}</span>${quiz.mode==='lightning'?`<span class="timer ${quiz.timeLeft<=3?'urgent':''}">00:${String(quiz.timeLeft).padStart(2,'0')}</span>`:`<span>♛ ${Math.round((quiz.idx+1)*10*quiz.pointsMult)} possible</span>`}</div><section class="question-card"><div class="qemoji">${quiz.mode==='lightning'?'ϟ':quiz.mode==='scramble'?'Aa':q[0]}</div><h2>${q[1]}</h2>${answerArea}${locked?`<div class="feedback">${selected===q[3]?'✨ Lovely work!':quiz.mode==='lightning'&&selected===-1?'⌛ Time is up!':'🌱 Not quite, but now you know!'} ${q[4]}</div>`:''}<div class="nextrow"><button class="primary" ${!locked?'disabled':''} onclick="nextQ()">${quiz.idx===quiz.questions.length-1?'See my results':'Next question →'}</button></div></section></div>`}function scrambleWord(word){let chars=word.replace(/[^a-z0-9]/gi,'').split('');if(chars.length<2)return word;let mixed=[...chars];for(let attempt=0;attempt<8&&mixed.join('').toLowerCase()===chars.join('').toLowerCase();attempt++)mixed=[...chars].sort(()=>Math.random()-.5);return mixed.join(' · ').toUpperCase()}
function normalizeAnswer(text){return text.toLowerCase().replace(/[^a-z0-9]/g,'')}
function submitScramble(event){event.preventDefault();if(quiz.answers[quiz.idx]!==undefined)return;let q=quiz.questions[quiz.idx],guess=document.getElementById('scrambleAnswer').value.trim(),answer=q[2][q[3]];q[2]=[guess,answer];q[3]=normalizeAnswer(guess)===normalizeAnswer(answer)?0:1;quiz.answers[quiz.idx]=0;if(state.settings.sound)beep();render()}
function choose(i){if(quiz.answers[quiz.idx]!==undefined)return;quiz.answers[quiz.idx]=i;if(state.settings.sound)beep();render()}
function startLightning(){if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!quiz||quiz.mode!=='lightning'||quiz.result||modal||quiz.answers[quiz.idx]!==undefined)return;quiz.timeLeft--;if(quiz.timeLeft<=0){quiz.answers[quiz.idx]=-1;render()}else render()},1000)}
function nextQ(){if(quiz.idx<quiz.questions.length-1){quiz.idx++;quiz.timeLeft=10;if(quiz.mode==='lightning')startLightning();render()}else finish()}function finish(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}state.questionHistory=state.questionHistory||{};(quiz.usedQuestionRefs||[]).forEach(ref=>{let seen=state.questionHistory[ref.pool]||[];if(!seen.includes(ref.key))seen.push(ref.key);let [category,level]=ref.pool.split('|'),capacity=category==='Daily Royal Quest'?0:bank[category]?.filter(q=>level==='Hard'?q[5]==='Hard':level==='Easy'?q[5]!=='Hard':true).length||state.custom.find(x=>x.name===category)?.questions.length||5;if(capacity&&seen.length>=capacity)seen=[];state.questionHistory[ref.pool]=seen});let score=quiz.answers.reduce((n,a,i)=>n+(a===quiz.questions[i][3]?1:0),0),n=quiz.questions.length,earned=Math.round(score*10*quiz.pointsMult)+(quiz.daily?25:0),crowns=Math.floor(score/2)+(quiz.daily&&score>0?1:0);state.points+=earned;state.crowns+=crowns;state.played++;state.correct+=score;state.total+=n;state.history.unshift({name:quiz.name,score,total:n,icon:quiz.icon});if(quiz.daily){state.streak++;state.best=Math.max(state.best,state.streak)}if(state.crowns>=15&&!state.unlocked.includes('Moonlit Fountain'))state.unlocked.push('Moonlit Fountain');if(state.crowns>=25&&!state.unlocked.includes('Crystal Garden'))state.unlocked.push('Crystal Garden');save();let prior=quiz;quiz={...prior,result:true,score,earned,crowns};render()}function results(){let q=quiz;return `${head()}<div class="quiz-area question-card results"><div class="cup">${q.score===q.questions.length?'🏆':'✨'}</div><span class="eyebrow" style="color:#a37bcf">${q.daily?'DAILY QUEST COMPLETE':'ADVENTURE COMPLETE'}</span><h2>${q.score===q.questions.length?'A perfect royal run!':q.score>=Math.ceil(q.questions.length*.6)?'Your kingdom is brighter!':'Every answer is an adventure!'}</h2><p style="color:var(--muted);font-size:12px">You finished <b>${q.name}</b>. Here’s how you did:</p><div class="scorecircle">${q.score}/${q.questions.length}</div><div style="display:flex;justify-content:center;gap:28px;font-size:12px"><span>✧ <b>+${q.earned}</b> points</span><span>♛ <b>+${q.crowns}</b> crowns</span></div><div class="review"><h3 style="font:700 17px 'Playfair Display'">Answer review</h3>${q.questions.map((x,i)=>`<div class="review-item"><b>${i+1}. ${x[1]}</b><span>${q.answers[i]===x[3]?'✓':'○'} Your answer: ${q.answers[i]<0?'Time expired':x[2][q.answers[i]]} · Correct: ${x[2][x[3]]}</span></div>`).join('')}</div><div class="result-actions"><button class="filter" onclick="go('Home')">Home</button><button class="primary" onclick="go('Quizzes')">Explore another quiz</button></div></div>`}function statsPage(){return `${head()}<h1 class="page-title">My Kingdom</h1><p class="page-sub">A little corner to celebrate everything you’ve learned.</p><div class="stats"><div class="stat"><div class="stat-top">Star points<span class="stat-icon">✧</span></div><strong>${state.points}</strong><small>Earned on your adventures</small></div><div class="stat"><div class="stat-top">Crowns<span class="stat-icon">♛</span></div><strong>${state.crowns}</strong><small>Spend them on decorations</small></div><div class="stat"><div class="stat-top">Quizzes<span class="stat-icon">📚</span></div><strong>${state.played}</strong><small>Completed adventures</small></div><div class="stat"><div class="stat-top">Best streak<span class="stat-icon">🔥</span></div><strong>${state.best} days</strong><small>Curiosity every day</small></div></div><div class="split"><div class="panel"><h3>Your decorations</h3><p class="sub">Little treasures for your growing kingdom.</p><div class="category-grid">${[['Starter Crown','👑',0],['Moonlit Fountain','⛲',15],['Crystal Garden','💎',25],['Royal Observatory','🔭',40],['Starlight Pavilion','🏯',60],['Golden Dragon','🐉',90]].map(([n,i,c])=>`<div class="cat" style="opacity:${state.crowns>=c?1:.55}"><span class="cat-icon">${i}</span><strong>${n}</strong><small>${state.crowns>=c?'Unlocked ✨':`Unlock at ${c} crowns`}</small>${state.crowns>=c?'<span style="float:right;color:#a17ccf">✓</span>':''}</div>`).join('')}</div></div><div class="panel"><h3>Recent adventures</h3><p class="sub">Your learning trail</p><div class="recent">${state.history.length?state.history.map(h=>`<div class="recent-row"><span class="cat-icon">${h.icon}</span><div><strong>${h.name}</strong><small>${h.score}/${h.total} correct</small></div><em>${Math.round(h.score/h.total*100)}%</em></div>`).join(''):'<div class="empty">Your first adventure is waiting ✨</div>'}</div></div></div>`}function dailyPage(){return `${head()}<section class="hero" style="min-height:250px"><div class="eyebrow">A fresh challenge every day</div><h1>Daily Royal Quest ☀️</h1><p>Five surprising questions from across the kingdom. A little learning, a lovely streak, bonus crowns.</p><button class="btn-gold" onclick="daily()">Start today’s quest →</button></section><div class="section-head"><div><h2>Your daily ritual</h2><p>Showing up is its own kind of magic.</p></div></div><div class="stats"><div class="stat"><div class="stat-top">Current streak <span class="stat-icon">🔥</span></div><strong>${state.streak} days</strong><small>Keep your curiosity glowing</small></div><div class="stat"><div class="stat-top">Personal best <span class="stat-icon">🏅</span></div><strong>${state.best} days</strong><small>Your longest learning streak</small></div><div class="stat"><div class="stat-top">Daily bonus <span class="stat-icon">♛</span></div><strong>+25</strong><small>Bonus points for completing</small></div><div class="stat"><div class="stat-top">Bonus crowns <span class="stat-icon">👑</span></div><strong>+1</strong><small>When you get one or more right</small></div></div>`}function createPage(){return `${head()}<h1 class="page-title">Create a quiz</h1><p class="page-sub">Gather your favorite questions and make a little adventure of your own.</p><div class="panel" style="max-width:720px"><form onsubmit="makeQuiz(event)"><label class="formlabel">Quiz name</label><input class="field" id="quizname" placeholder="e.g. Wonders of the Ocean" maxlength="40" required><label class="formlabel">Realm</label><select id="quizcat" class="field">${Object.keys(categories).map(c=>`<option>${c}</option>`).join('')}</select><div id="questionFields">${[1,2,3].map((n)=>`<div style="padding:14px 0;border-top:1px solid var(--line)"><b style="font-size:12px">Question ${n}</b><input class="field" name="question" placeholder="Write a question…" required><div class="two-col">${[0,1,2,3].map((i)=>`<input class="field" name="answer${n}" placeholder="Answer ${'ABCD'[i]}${i===0?' (correct)':''}" required>`).join('')}</div><span style="font-size:10px;color:var(--muted)">First answer is the correct answer.</span></div>`).join('')}</div><button class="filter" type="button" onclick="addQuestion()">＋ Add a question</button><button class="primary" style="display:block;margin-top:18px" type="submit">Save my quiz ✨</button></form></div>`}function addQuestion(){let box=document.getElementById('questionFields'),n=box.children.length+1;box.insertAdjacentHTML('beforeend',`<div style="padding:14px 0;border-top:1px solid var(--line)"><b style="font-size:12px">Question ${n}</b><input class="field" name="question" placeholder="Write a question…" required><div class="two-col">${[0,1,2,3].map((i)=>`<input class="field" name="answer${n}" placeholder="Answer ${'ABCD'[i]}${i===0?' (correct)':''}" required>`).join('')}</div><span style="font-size:10px;color:var(--muted)">First answer is the correct answer.</span></div>`)}function makeQuiz(e){e.preventDefault();let f=e.target,qs=[...f.querySelectorAll('[name=question]')].map((el,i)=>['✨',el.value,[...f.querySelectorAll(`[name=answer${i+1}]`)].map(x=>x.value),0,'The first answer is the one you marked correct.']);state.custom.push({name:f.quizname.value,category:f.quizcat.value,questions:qs});save();toast('Your quiz is ready for its first adventure!');go('Quizzes')}function settings(){return `${head()}<h1 class="page-title">Settings</h1><p class="page-sub">Make the kingdom feel just right for you.</p><div class="two-col"><div class="panel"><h3>Preferences</h3><p class="sub">Your adventure, your way.</p>${[['Sound effects','Gentle chimes for your answers','sound'],['Reduced motion','Keep things calm and still','motion'],['Daily reminders','A little nudge to keep your streak','reminders']].map(([a,b,k])=>`<div class="setting-row"><div>${a}<small>${b}</small></div><button class="toggle ${state.settings[k]?'on':''}" onclick="toggleSetting('${k}')"></button></div>`).join('')}<div class="setting-row"><div>Quiz difficulty<small>Choose the level that feels right.</small></div><select class="filter" onchange="setSetting('difficulty',this.value)">${['Easy','Medium','Hard'].map(x=>`<option ${state.settings.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="panel"><h3>Kingdom look</h3><p class="sub">Choose your favorite pastel palette.</p><div class="setting-row"><div>Color theme<small>Your choice is saved on this device.</small></div><select class="filter" onchange="setTheme(this.value)">${[['sage','Sage garden'],['dusk','Deep forest'],['rose','Soft sage'],['mint','Meadow green']].map(([k,v])=>`<option value="${k}" ${state.settings.theme===k?'selected':''}>${v}</option>`).join('')}</select></div><div style="margin-top:22px;padding:16px;border-radius:14px;background:#faf7ff"><b style="font-size:12px">A fresh start?</b><p style="color:var(--muted);font-size:11px;line-height:1.6">Your kingdom is saved privately in this browser. You can reset your local demo progress any time.</p><button class="filter" onclick="resetProgress()">Reset my progress</button></div></div></div>`}function toggleSetting(k){state.settings[k]=!state.settings[k];save();render()}function setSetting(k,v){state.settings[k]=v;save();render()}function setTheme(v){state.settings.theme=v;save();render()}function resetProgress(){modal='reset';render()}function confirmExit(){modal='exit';render()}function modalView(){if(!modal)return'';return `<div class="modalback" onclick="if(event.target===this){modal=null;render()}"><div class="modal"><div class="modalhead"><h3>${modal==='reset'?'Reset your kingdom?':'Leave this adventure?'}</h3><button class="close" onclick="modal=null;render()">×</button></div><p style="font-size:12px;line-height:1.6;color:var(--muted)">${modal==='reset'?'This clears your locally saved quiz progress and custom quizzes.':'Your answers in this quiz will be lost, but your saved progress stays safe.'}</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="filter" onclick="modal=null;render()">Keep going</button><button class="primary" onclick="if(modal==='reset'){state=initial();save();page='Home'}else page='Quizzes';modal=null;quiz=null;render()">${modal==='reset'?'Reset progress':'Leave quiz'}</button></div></div></div>`}function beep(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=660;g.gain.value=.025;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09)}catch{}}function render(){document.body.className=(state.settings.theme==='lavender'?'':state.settings.theme)+(state.settings.motion?' calm':'');if(introActive){document.getElementById('root').innerHTML=intro();return}let content=page==='Home'?home():page==='Game Arcade'?arcade():page==='Quizzes'?quizzes():page==='Daily Quest'?dailyPage():page==='My Kingdom'?statsPage():page==='Create Quiz'?createPage():page==='Settings'?settings():page==='Play'?(quiz?.result?results():play()):home();document.getElementById('root').innerHTML=`<div class="app">${nav()}<main class="main">${content}</main></div>${modalView()}`};render();
</script></body></html>
